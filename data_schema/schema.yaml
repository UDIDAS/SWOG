# Schema for the five benchmark tables consumed by oakg.data.load_experiment_data.
# All five CSVs live in the configured data_dir (default: data/).

cases:
  file: cases.csv
  columns:
    case_id: {type: str, desc: unique case identifier}
    dataset: {type: str, desc: source dataset name (e.g. Pancreas, LiTS, FLARE)}
    split: {type: str, enum: [train, val, test], desc: patient-level split}
    available_organs: {type: str, desc: "'|'-joined organs annotated for this case"}

phenotypes_ref:
  file: phenotypes_ref.csv
  desc: reference-annotation-derived phenotypes (controlled-mechanism track)
  columns:
    case_id: {type: str}
    feature: {type: str, desc: phenotype feature name}
    value: {type: float, desc: numeric value or 0/1 for binary features}
    feature_type: {type: str, enum: [numeric, binary], desc: comparison semantics}
    support_organs: {type: str, desc: "'|'-joined organs whose annotation supports this feature; empty = global"}

phenotypes_pred:
  file: phenotypes_pred.csv
  desc: predicted-segmentation-derived phenotypes (end-to-end track); same schema as phenotypes_ref

queries:
  file: queries.csv
  columns:
    query_id: {type: str}
    query_case_id: {type: str, desc: case the query is derived from}
    primary_predicates: {type: json, desc: "list of {feature, op, value, support_organs}"}
    secondary_predicates: {type: json, desc: "list of {feature, op, value, support_organs}"}

relevance:
  file: relevance.csv
  desc: method-independent relevance from complete reference annotations
  columns:
    query_id: {type: str}
    candidate_id: {type: str}
    binary_relevance: {type: int, enum: [0, 1]}
    graded_relevance: {type: float, desc: graded relevance grade (e.g. 0-3)}

controls:
  - Patient-level splits; no masked realization of a patient appears in two splits.
  - Reference annotations define relevance labels + image-access boundary only;
    they never supply reference-derived features to end-to-end predicted-track models.
  - Each query and candidate carries its own observation mask; the retained organ
    set is recorded per case and seed in every masking realization's metadata.
