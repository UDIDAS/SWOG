[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oakg"
version = "0.1.0"
description = "Observability-Aware Knowledge Graph Reasoning for Heterogeneous Medical Imaging (AAAI 2027)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "nibabel>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
