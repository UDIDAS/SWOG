# OAKG default experiment configuration.
# Mirrors src/oakg/config.py::Config. Every threshold/seed/path fixed here so
# results are reproducible. Switch use_demo_data to false and populate data/
# with the five benchmark CSVs to run on the real FLARE benchmark.

seed: 2027
top_k: 10
organs: [liver, pancreas, spleen, left_kidney, right_kidney]

use_demo_data: true
n_demo_cases: 120

run_wl_baseline: true
run_neural_baselines: false   # enable once CompGCN/CT embeddings exist

n_bootstrap: null             # null -> 500 for demo, 10000 for the real study

data_dir: data
results_dir: results
embeddings_dir: embeddings
